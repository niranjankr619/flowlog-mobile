<svg width="600" height="256" viewBox="0 0 600 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon -->
  <g transform="translate(50, 0)">
    <!-- Outer ring - Indigo to Aqua gradient -->
    <circle
      cx="128"
      cy="128"
      r="112"
      stroke="url(#gradient1)"
      stroke-width="16"
      fill="none"
      stroke-linecap="round"
    />
    
    <!-- Inner flow lines -->
    <path
      d="M128 48 L128 80 M128 176 L128 208 M48 128 L80 128 M176 128 L208 128"
      stroke="#4B5CFB"
      stroke-width="16"
      stroke-linecap="round"
      opacity="0.6"
    />
    
    <!-- Center dot -->
    <circle
      cx="128"
      cy="128"
      r="24"
      fill="url(#gradient2)"
    />
    
    <!-- Flowing arc segments -->
    <path
      d="M 186.4 69.6 A 80 80 0 0 1 186.4 186.4"
      stroke="#00C7B7"
      stroke-width="16"
      stroke-linecap="round"
      opacity="0.8"
    />
  </g>
  
  <!-- Wordmark -->
  <text
    x="320"
    y="145"
    font-family="Urbanist, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="1.5"
    fill="#FFFFFF"
  >
    FLOWLOG
  </text>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5CFB" />
      <stop offset="100%" stop-color="#00C7B7" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C7B7" />
      <stop offset="100%" stop-color="#4B5CFB" />
    </linearGradient>
  </defs>
</svg>
